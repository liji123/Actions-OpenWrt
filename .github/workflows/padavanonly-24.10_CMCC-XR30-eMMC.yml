name: padavanonly-24.10_CMCC-XR30-eMMC

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  DEVICE_CONFIG: CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_xr30-emmc=y

jobs:
  build:
    name: Build CMCC XR30 eMMC
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Actions-OpenWrt
        uses: actions/checkout@v4

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget curl
          sudo mkdir -p /workdir
          sudo chown "$USER":"$USER" /workdir

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: false
          haskell: false
          large-packages: false
          swap-storage: false

      - name: Clone ImmortalWrt source
        working-directory: /workdir
        run: |
          git clone --depth=1 "$REPO_URL" -b "$REPO_BRANCH" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

      - name: Apply CMCC XR30 eMMC support (PR #437)
        working-directory: /workdir/openwrt
        run: |
          PATCH_URL="https://github.com/padavanonly/immortalwrt-mt798x-6.6/pull/437.patch"
          if grep -q 'define Device/cmcc_xr30-emmc' target/linux/mediatek/image/filogic.mk && \
             test -f target/linux/mediatek/dts/mt7981b-cmcc-xr30-emmc.dts; then
            echo "XR30 eMMC support is already present in the source."
          else
            curl -fL "$PATCH_URL" -o /tmp/xr30-emmc-pr437.patch
            git apply --check /tmp/xr30-emmc-pr437.patch
            git apply /tmp/xr30-emmc-pr437.patch
          fi
          grep -q 'define Device/cmcc_xr30-emmc' target/linux/mediatek/image/filogic.mk
          test -f target/linux/mediatek/dts/mt7981b-cmcc-xr30-emmc.dts

      - name: Configure XR30 eMMC target
        run: |
          cp "$GITHUB_WORKSPACE/padavanonly-24.10/CMCC-XR30-eMMC/.config" /workdir/openwrt/.config
          cd /workdir/openwrt
          make defconfig
          grep -Fx "$DEVICE_CONFIG" .config

      - name: Download package sources
        working-directory: /workdir/openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -print -delete

      - name: Build firmware
        working-directory: /workdir/openwrt
        run: |
          echo "Building with $(nproc) threads"
          if ! make -j"$(nproc)"; then
            echo "Parallel build failed; retrying serially with verbose output."
            make -j1 V=s
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-24.10-CMCC-XR30-eMMC
          path: /workdir/openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: error
          retention-days: 14
